<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>NexShare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e6fd9'/%3E%3Cpath d='M14 21h12l4 4h20a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H14a3 3 0 0 1-3-3V24a3 3 0 0 1 3-3z' fill='%23ffc94a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="hidden">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="app-ico" data-ico="filestation"></div>
    <h1>NexShare</h1>
    <p id="loginServer">ใส่ PIN ที่แสดงในแอปบนมือถือ</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autofocus>
    <input id="loginUser" class="hidden" type="text" autocomplete="username" placeholder="ชื่อผู้ใช้">
    <input id="loginPass" class="hidden" type="password" autocomplete="current-password" placeholder="รหัสผ่าน">
    <button class="btn primary" type="submit">เข้าสู่ระบบ</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<header id="topbar">
  <button class="tb-btn" id="mainMenuBtn" title="เมนูหลัก">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1.6"/><rect x="11" y="2" width="7" height="7" rx="1.6"/><rect x="2" y="11" width="7" height="7" rx="1.6"/><rect x="11" y="11" width="7" height="7" rx="1.6"/></svg>
  </button>
  <div id="taskApps"></div>
  <div class="tb-spacer"></div>
  <button class="tb-btn" id="uploadsBtn" title="งานอัปโหลด">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <span class="badge hidden" id="uploadsBadge">0</span>
  </button>
  <button class="tb-btn" id="notifBtn" title="การแจ้งเตือน">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  </button>
  <button class="tb-btn tb-user" id="userBtn" title="บัญชี">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    <span id="serverName">NexShare</span>
  </button>
  <button class="tb-btn" id="searchBtn" title="ค้นหาไฟล์">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  </button>
  <button class="tb-btn" id="infoBtn" title="ข้อมูลระบบ">
    <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1e6fd9"/><path d="M12 7v.01M12 11v6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
  <button class="tb-btn active" id="widgetsBtn" title="วิดเจ็ต">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M14 3v18"/></svg>
  </button>
</header>

<main id="desktop"></main>

<aside id="widgets">
  <div class="w-head">
    <button id="wAdd" title="เพิ่มวิดเจ็ต"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="wMin" title="ซ่อนวิดเจ็ต"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="wPin" class="on" title="ปักหมุด"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v8"/></svg></button>
  </div>
  <section class="widget" id="wHealth">
    <h3><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="#2a8ad8"/><path d="M12 7v.01M12 10.5v6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>System Health</h3>
    <div class="health-top">
      <svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="25" fill="#2fb36b"/><path d="M16 28l7 7 15-16" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><div class="big" id="hState">Good</div><div class="sub" id="hSub">มือถือของคุณทำงานปกติ</div></div>
    </div>
    <dl class="kv">
      <dt>Server Name</dt><dd id="hName">-</dd>
      <dt>LAN IP</dt><dd id="hIp">-</dd>
      <dt>Local domain</dt><dd id="hHost">-</dd>
      <dt>Uptime</dt><dd id="hUp">-</dd>
    </dl>
  </section>
  <section class="widget" id="wRes">
    <h3><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2" fill="#2a8ad8"/><path d="M5 13h3l2-5 3 9 2-4h4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>Resource Monitor</h3>
    <div class="meter"><div class="row"><span>CPU</span><b id="rCpu">-</b></div><div class="bar"><i id="rCpuBar"></i></div></div>
    <div class="meter"><div class="row"><span>RAM</span><b id="rRam">-</b></div><div class="bar"><i id="rRamBar"></i></div></div>
    <div class="net">
      <span class="lbl">LAN</span>
      <span class="up">🡅 <b id="rUp">0 KB/s</b></span>
      <span class="down">🡇 <b id="rDown">0 KB/s</b></span>
    </div>
    <div class="chart-box"><div class="yl"><span>100</span><span>80</span><span>60</span><span>40</span><span>20</span><span>0</span></div><canvas class="chart" id="rChart"></canvas></div>
  </section>
  <section class="widget" id="wStorage">
    <h3><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="#2a8ad8"/><path d="M6 9h12M6 14h12" stroke="#fff" stroke-width="1.8"/><circle cx="16" cy="11.5" r="1" fill="#fff"/><circle cx="16" cy="16.5" r="1" fill="#fff"/></svg>Storage</h3>
    <div class="meter"><div class="row"><span id="sName">Internal storage</span><b id="sPct">-</b></div><div class="bar"><i id="sBar"></i></div></div>
    <dl class="kv">
      <dt>ใช้ไป</dt><dd id="sUsed">-</dd>
      <dt>ว่าง</dt><dd id="sFree">-</dd>
      <dt>แบตเตอรี่</dt><dd id="sBat">-</dd>
    </dl>
  </section>
</aside>

<div id="uploads" class="hidden">
  <div class="u-head"><span id="uTitle">กำลังอัปโหลด</span>
    <button class="win-btn" id="uClear" title="ล้างรายการที่เสร็จแล้ว"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    <button class="win-btn" id="uClose" title="ซ่อน"><svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="u-list" id="uList"></div>
</div>

<div id="toasts"></div>
<input type="file" id="filePick" multiple class="hidden">
<input type="file" id="folderPick" webkitdirectory multiple class="hidden">
<script src="app.js"></script>
</body>
</html>
